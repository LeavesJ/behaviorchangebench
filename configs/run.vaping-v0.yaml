# Run config for the Oct 8 prototype (trajectories/vaping-v0). One file drives every step:
#   PYTHONPATH=src python -m bcb <command> --config configs/run.vaping-v0.yaml
# "TK" marks a choice still open (details.md section 12). A step that needs an unset value
# refuses to run and names it. Results land in runs/<run_id>/ (gitignored until labeling is done,
# so grader output stays sealed from labelers).

run_id: vaping-v0-r1
spec: trajectories/vaping-v0/spec.yaml
conversation: trajectories/vaping-v0/conversation.v1.0.yaml
examples: trajectories/vaping-v0/examples.yaml
prompts:
  generator: prompts/generator.v0.1.md
  grader: prompts/grader.v0.1.md
output_dir: runs

checkpoints: default        # spec run.checkpoints; add KM7-P by listing checkpoints explicitly if adopted
samples: 3
system_prompt: null         # spec run.system_prompt; the one-line variant is a separate run_id
items: all                  # or the v1 subset as a list of item IDs (Meeting 2 question 6)
packet_seed: 20261001       # seeds the reply shuffle in labeling packets

# The study's families under test, whichever models a given run lists. README rule 5 (the judge's
# family is never under test) and the generator's self-preference flag both check against it.
families_under_test: [anthropic, openai, google]   # add the open-weight family once chosen

# Models under test: one per family, none from a grader's family (README rule 5). Pin exact IDs.
# `params` go to the API verbatim and are recorded on every row; empty means vendor defaults.
# Credentials come from the environment (see api_key_env), never from this file.
models:
  # First model under test (team decision, Sep 29): OpenAI GPT-6 Astra. Chat Completions supports it;
  # it is a reasoning model, rejects temperature and top_p, and counts reasoning tokens against
  # max_completion_tokens, so the limit is set well above a chat reply. OpenAI does not document
  # its default reasoning_effort, so `params: {}` leaves the effective effort unrecorded.
  # TODO(team): pin reasoning_effort explicitly (and a dated snapshot if OpenAI publishes one).
  - {slot: M2, family: openai, provider: openai_compat, model_id: gpt-6-astra, base_url: null,
     api_key_env: OPENAI_API_KEY, token_limit_param: max_completion_tokens, max_output_tokens: 32000, params: {}}
  # Add the other slots as they are pinned (spec run.models); new slots join the same run_id.
  # - {slot: M1, family: anthropic, provider: anthropic, model_id: TK, max_output_tokens: 16000, params: {}}
  # - {slot: M3, family: google, provider: openai_compat, model_id: TK, base_url: TK,
  #    api_key_env: GEMINI_API_KEY, token_limit_param: max_tokens, max_output_tokens: 16000, params: {}}
  # - {slot: M4, family: TK, provider: openai_compat, model_id: TK, base_url: TK,
  #    api_key_env: TK, token_limit_param: max_tokens, max_output_tokens: 16000, params: {}}

graders:
  # DeepSeek (proposed Sep 21). Model ID TK: deepseek-flash (V4.1-Flash, Sep 10) or deepseek-v4-pro.
  # Its weights are open, so the open-weight model under test cannot be DeepSeek. Thinking mode is
  # set through params (extra_body) and should be pinned explicitly either way.
  primary:
    {family: deepseek, provider: openai_compat, model_id: TK, base_url: "https://api.deepseek.com",
     api_key_env: DEEPSEEK_API_KEY, token_limit_param: max_tokens, max_output_tokens: 8000, params: {}}
  second:                   # another family not under test; regrades the same saved replies
    {family: TK, provider: openai_compat, model_id: TK, base_url: TK, api_key_env: TK,
     token_limit_param: max_tokens, max_output_tokens: 8000, params: {}}

# Never a grader; prefer a family not under test (spec generation.generator). If its family is
# under test, the generation record says so (self-preference). The v1 conversation was written by
# Claude in a Claude Code session (team decision, Sep 29); its per-session outputs are replayed
# through the same contract from trajectories/vaping-v0/generation/. Anthropic is under test, so
# the record flags self-preference. TODO(team): record the session's exact model ID in the record.
generator:
  {family: anthropic, provider: replay, model_id: claude-code-session, replay_dir: trajectories/vaping-v0/generation}

# USD per million tokens, from the pinned models' price sheets, keyed by model_id. A model with no
# entry gets cost null in the manifest; nothing is estimated.
prices: {}
