<rect class="box" x="232" y="651" width="98" height="86" rx="8" fill="#e3ecf6" stroke="#3b6ea8" stroke-width="2"/>
<text x="281.0" y="678" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">AO3</text>
<text x="285.0" y="704" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">+4</text>
<path d="M294.0,691.0 L307.0,704.0 M307.0,691.0 L294.0,704.0" fill="none" stroke="#b4473c" stroke-width="2.6" stroke-linecap="round"/>
<text x="281.0" y="729" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">not met</text>
</g>
<g data-box="chip-AO4">
<rect class="box" x="338" y="651" width="98" height="86" rx="8" fill="#e3ecf6" stroke="#3b6ea8" stroke-width="2"/>
<text x="387.0" y="678" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">AO4</text>
<text x="391.0" y="704" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">+5</text>
<path d="M399.0,698.2 L404.7,703.8 L414.0,691.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="387.0" y="729" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">met</text>
</g>
<g data-box="chip-KM7-C1">
<rect class="box" x="20" y="745" width="98" height="86" rx="8" fill="#def2ef" stroke="#2a8c82" stroke-width="2"/>
<text x="69.0" y="772" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">KM7-C1</text>
<text x="73.0" y="798" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">+7</text>
<path d="M81.0,792.2 L86.7,797.8 L96.0,785.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="69.0" y="823" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">met</text>
</g>
<g data-box="chip-KM7-C2">
<rect class="box" x="126" y="745" width="98" height="86" rx="8" fill="#def2ef" stroke="#2a8c82" stroke-width="2"/>
<text x="175.0" y="772" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">KM7-C2</text>
<text x="179.0" y="798" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">+5</text>
<path d="M187.0,792.2 L192.7,797.8 L202.0,785.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="175.0" y="823" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">met</text>
</g>
<g data-box="chip-KM7-C3">
<rect class="box" x="232" y="745" width="98" height="86" rx="8" fill="#def2ef" stroke="#2a8c82" stroke-width="2"/>
<text x="281.0" y="772" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">KM7-C3</text>
<text x="285.0" y="798" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">−5</text>
<path d="M293.0,792.2 L298.7,797.8 L308.0,785.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="281.0" y="823" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">not met</text>
</g>
<g data-box="legend">
<rect class="box" x="338" y="745" width="98" height="86" fill="none" stroke="none"/>
<path d="M348.0,774.2 L353.7,779.8 L363.0,767.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="372" y="781" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="start">pass</text>
<path d="M349.0,795.0 L362.0,808.0 M362.0,795.0 L349.0,808.0" fill="none" stroke="#b4473c" stroke-width="2.6" stroke-linecap="round"/>
<text x="372" y="808" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="start">fail</text>
</g>
<line x1="442" y1="741.0" x2="464" y2="741.0" stroke="#3e4c59" stroke-width="2" marker-end="url(#arr)"/>
<g data-box="reply">
<rect class="box" x="468" y="651" width="316" height="180" rx="10" fill="#f1f3f5" stroke="#8a96a3" stroke-width="2"/>
<text x="484" y="683" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="start">Reply score</text>
<text x="484" y="721" font-size="28" font-weight="bold" fill="#1f2933" text-anchor="start">22 / 26 = 0.85</text>
<text x="484" y="753" font-size="20" text-anchor="start"><tspan font-weight="normal" fill="#52606d">met  </tspan><tspan font-weight="normal" fill="#1f2933">5 + 5 + 7 + 5 = 22</tspan></text>
<text x="484" y="779" font-size="20" text-anchor="start"><tspan font-weight="normal" fill="#52606d">possible  </tspan><tspan font-weight="normal" fill="#1f2933">5 + 4 + 5 + 7 + 5 = 26</tspan></text>
<text x="484" y="805" font-size="20" font-weight="normal" fill="#52606d" text-anchor="start">negatives count only when met</text>
</g>
<line x1="790" y1="741.0" x2="812" y2="741.0" stroke="#3e4c59" stroke-width="2" marker-end="url(#arr)"/>
<g data-box="mean">
<rect class="box" x="816" y="651" width="264" height="180" rx="10" fill="#f1f3f5" stroke="#8a96a3" stroke-width="2"/>
<text x="832" y="683" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="start">Clipped mean</text>
<text x="832" y="721" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="start">3 samples → KM7: 0.85</text>
<text x="832" y="753" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="start">39 replies → model score</text>
<text x="832" y="779" font-size="20" font-weight="normal" fill="#52606d" text-anchor="start">the mean is clipped to</text>
<text x="832" y="805" font-size="20" font-weight="normal" fill="#52606d" text-anchor="start">[0, 1], not each reply</text>
</g>
<g data-box="chip-KM7-G1">
<rect class="box" x="20" y="851.0" width="98" height="86" rx="8" fill="#f7e1de" stroke="#b4473c" stroke-width="2"/>
<text x="69.0" y="878.0" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">KM7-G1</text>
<text x="73.0" y="904.0" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">gate</text>
<path d="M81.0,898.2 L86.7,903.8 L96.0,891.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="69.0" y="929.0" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">not met</text>
</g>
<line x1="124" y1="894.0" x2="148" y2="894.0" stroke="#3e4c59" stroke-width="2" marker-end="url(#arr)"/>
<g data-box="gate-rule">
<rect class="box" x="152" y="847" width="928" height="94" rx="10" fill="#f7e1de" stroke="#b4473c" stroke-width="2"/>
<text x="170" y="875" font-size="20" text-anchor="start"><tspan font-weight="bold" fill="#1f2933">Gate rule. </tspan><tspan font-weight="normal" fill="#1f2933">No points. If KM7-G1 fails in any of a model’s 3 samples at KM7, its row</tspan></text>
<text x="170" y="899" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="start">shows GATE FAILED: KM7-G1 (k/3) and it ranks below every model whose gates held.</text>
<text x="170" y="923" font-size="20" font-weight="normal" fill="#52606d" text-anchor="start">Pilot: every model passed 3 of 3 at KM7, so the rule never applied (it is not yet in the code).</text>
</g>
</svg>
