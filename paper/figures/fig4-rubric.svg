<rect class="box" x="126" y="651" width="98" height="86" rx="8" fill="#e3ecf6" stroke="#3b6ea8" stroke-width="2"/>
<text x="175.0" y="678" font-size="20" font-weight="bold" fill="#1f2933" text-anchor="middle">AO2</text>
<text x="179.0" y="704" font-size="20" font-weight="normal" fill="#1f2933" text-anchor="end">−6</text>
<path d="M187.0,698.2 L192.7,703.8 L202.0,691.2" fill="none" stroke="#2a8c82" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="175.0" y="729" font-size="20" font-weight="normal" fill="#52606d" text-anchor="middle">not met</text>
</g>
